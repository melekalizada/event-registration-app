<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="form-container">
        <h1>Tech Event Registration</h1>
        <p>Register below to join our technology event.</p>

        <div id="message" class="message"></div>

        <form id="registration-form">
          <div class="form-group">
            <label class="input-label" for="name">Full Name</label>
            <input
              class="forminput"
              type="text"
              id="name"
              placeholder="Melek Alizada"
            />
          </div>

          <div class="form-group">
            <label class="input-label" for="email">Email Address</label>
            <input
              class="forminput"
              type="text"
              id="email"
              placeholder="melekalizada@gmail.com"
            />
          </div>

          <div class="form-group">
            <label class="input-label" for="age">Age</label>
            <input class="forminput" type="number" id="age" placeholder="20" />
          </div>

          <div class="form-group">
            <label class="input-label" for="technology">Technology</label>
            <select class="forminput" id="technology">
              <option value="">-- Select --</option>
              <option value="HTML">HTML</option>
              <option value="CSS">CSS</option>
              <option value="JavaScript">JavaScript</option>
              <option value="React">React</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="terms" />
            <label for="terms">I accept the terms and conditions</label>
          </div>

          <button class="btn" type="submit">Register</button>
        </form>

        <div id="stats" class="stats hidden"></div>

        <div id="participant-list"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
